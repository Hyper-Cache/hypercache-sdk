[package]
name = "hypercache-kv"
version = "0.1.1"
edition = "2021"
exclude = ["tests"]
description = "Official Rust client for the HyperCache API."
authors = ["Hyper Cache <contact@hypercache.ai>"]
license = "MIT"
keywords = ["ai", "llm", "cache", "inference"]
categories = ["api-bindings"]
readme = "README.md"
homepage = "https://hypercache.ai"
repository = "https://github.com/Hyper-Cache/hypercache-sdk"
documentation = "https://docs.rs/hypercache-kv"

[lib]
name = "hypercache"
path = "src/lib.rs"

[dependencies]
# Blocking HTTP client with pure-Rust TLS (rustls). No tokio runtime needed.
ureq = "2.10"
# JSON parsing (no derive macros).
serde_json = "1"
