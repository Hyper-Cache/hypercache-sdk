[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hypercache-kv"
version = "0.1.1"
description = "Official Python client for the HyperCache API."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Hyper Cache", email = "contact@hypercache.ai" }]
keywords = ["ai", "llm", "cache", "inference"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
numpy = ["numpy>=1.20"]
torch = ["torch>=2.0"]
test = ["pytest>=7", "numpy>=1.20"]

[project.urls]
homepage = "https://hypercache.ai"
documentation = "https://hypercache.ai/docs"
repository = "https://github.com/Hyper-Cache/hypercache-sdk"
issues = "https://github.com/Hyper-Cache/hypercache-sdk/issues"

[tool.setuptools.packages.find]
where = ["src"]
